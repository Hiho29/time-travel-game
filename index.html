<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>История стран по годам</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #1a1a1a;
    color: #f0f0f0;
    text-align: center;
    padding: 30px;
  }

  button {
    background: #333;
    color: white;
    border: none;
    padding: 10px 20px;
    margin: 5px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
  }

  button:hover {
    background: #555;
  }

  input {
    margin-top: 10px;
    padding: 5px;
    border-radius: 5px;
    border: none;
    text-align: center;
  }

  #countryInfo {
    margin-top: 30px;
    background: #222;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px #000;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
  }

  #countryName {
    font-size: 24px;
    font-weight: bold;
    margin-top: 20px;
  }
</style>
</head>
<body>

<h2>Выбери страну и год</h2>

<!-- Кнопки выбора страны -->
<button onclick="selectCountry('russia')">Россия</button>
<button onclick="selectCountry('usa')">США</button>
<button onclick="selectCountry('china')">Китай</button>

<!-- Поле для выбора года -->
<h3>Год:</h3>
<input id="yearInput" type="number" min="1900" max="2100" value="2025" step="1" oninput="updateTime()">

<!-- Панель отображения информации -->
<h2 id="countryName"></h2>
<div id="countryInfo"></div>

<script>
// --- "База данных" событий по странам ---
const database = {
 russia: {
  2000: { description: "Россия в 2000 году: начало нового тысячелетия, экономические реформы." },
  2010: { description: "Россия в 2010 году: рост технологий и культуры." },
  2020: { description: "Россия в 2020 году: пандемия, цифровизация, дистанционное образование." },
  2025: { description: "Россия в 2025 году: развитие искусственного интеллекта и новых городов." }
 },
 usa: {
  2000: { description: "США в 2000 году: развитие интернета и технологий." },
  2010: { description: "США в 2010 году: становление социальных сетей." },
  2020: { description: "США в 2020 году: пандемия, выборы и инновации." },
  2025: { description: "США в 2025 году: полёты на Марс и новые технологии." }
 },
 china: {
  2000: { description: "Китай в 2000 году: быстрый экономический рост." },
  2010: { des
cription: "Китай в 2010 году: развитие мегаполисов и промышленности." },
  2020: { description: "Китай в 2020 году: цифровизация и роботизация." },
  2025: { description: "Китай в 2025 году: лидер в области искусственного интеллекта." }
 }
};

// --- Текущая выбранная страна ---
let currentCountry = 'russia';

// --- Обновление панели информации ---
function updateInfoPanel(countryId, year) {
 const countryNameMap = { russia: 'Россия', usa: 'США', china: 'Китай' };
 document.getElementById('countryName').textContent = countryNameMap[countryId];

 const infoElement = document.getElementById('countryInfo');
 const countryData = database[countryId];

 if (!countryData) {
  infoElement.textContent = "Нет данных по этой стране.";
  return;
 }

 const availableYears = Object.keys(countryData).map(y => parseInt(y)).sort((a, b) => a - b);

 let closestYear = null;
 let minDiff = Infinity;

 for (const dataYear of availableYears) {
  const diff = Math.abs(dataYear - year);
  if (diff < minDiff) {
   minDiff = diff;
   closestYear = dataYear;
  }
 }

 if (closestYear !== null) {
  const data = countryData[closestYear];
  infoElement.innerHTML = `<p><strong>Информация за ${closestYear} год (ближайшая к ${year}):</strong></p><p>${data.description}</p>`;
 } else {
  infoElement.textContent = "Данные недоступны.";
 }
}

// --- При выборе страны ---
function selectCountry(countryId) {
 currentCountry = countryId;
 const year = parseInt(document.getElementById('yearInput').value);
 updateInfoPanel(countryId, year);
}

// --- При изменении года ---
function updateTime() {
 const year = parseInt(document.getElementById('yearInput').value);
 updateInfoPanel(currentCountry, year);
}

// --- Запуск при загрузке страницы ---
selectCountry('russia');
updateTime();

</body>
</html>
