<!DOCTYPE html>
<html lang="ru">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Time Traveler Prototype</title>
 <style>
 /* Общие настройки */
 body { 
 font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
 display: flex; 
 flex-direction: column; 
 align-items: center; 
 padding: 30px; 
 background-color: #1a1a2e; /* Темный фон */
 color: #e4e4e4; /* Светлый текст */
 margin: 0;
 }

 /* Контейнер для ползунка */
 .time-slider-container { 
 width: 90%; 
 max-width: 800px;
 margin-bottom: 40px; 
 padding: 25px; 
 background-color: #2c2c54; /* Чуть светлее фон */
 border-radius: 12px; 
 box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4); 
 }

 /* Заголовок шкалы времени */
 h2 { 
 color: #84a9ff; /* Голубой акцент */
 text-align: center;
 margin-top: 0;
 }

 /* Ползунок */
 #timeSlider { 
 width: 100%; 
 height: 8px;
 -webkit-appearance: none;
 appearance: none;
 background: #55557a; /* Цвет дорожки */

 border-radius: 4px;
 cursor: pointer;
 }
 /* Кружок ползунка */
 #timeSlider::-webkit-slider-thumb {
 -webkit-appearance: none;
 appearance: none;
 width: 20px;
 height: 20px;
 border-radius: 50%;
 background: #84a9ff;
 cursor: pointer;
 box-shadow: 0 0 5px #84a9ff;
 transition: background-color 0.2s;
 }

 /* Контейнер кнопок */
 .map-container { 
 display: flex; 
 width: 90%; 
 max-width: 800px;
 justify-content: space-around; 
 margin-bottom: 30px; 
 gap: 10px;
 }

 /* Кнопки стран */
 .country-button { 
 flex-grow: 1;
 padding: 12px 25px; 
 cursor: pointer; 
 border: none;
 background-color: #4a4e69; /* Серый фон */
 color: #e4e4e4;
 border-radius: 8px; 
 transition: background-color 0.3s, transform 0.1s, box-shadow 0.3s; 
 text-align: center;
 font-size: 16px;
 font-weight: bold;
 letter-spacing: 0.5px;
 }

 /* Эффект при наведении */
 .country-button:hover { 
 background-color: #6a6e9a; 
 transform: translateY(-2px);
 box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
 }

 /* Активная (выбранная) кнопка */
 .country-button.active {
 background-color: #84a9ff; /* Акцентный голубой */
 color: #1a1a2e;
 box-shadow: 0 0 15px rgba(132, 169, 255, 0.7);
 border: 1px solid #c0caff;
 }

 /* Панель информации */
 .info-panel { 
 width: 90%; 
 max-width: 800px;
 min-height: 250px; 
 padding: 30px; 
 border: 1px solid #4a4e69; 
 background-color: #2c2c54; 
 border-radius: 12px; 
 box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
 line-height: 1.6;
 }

 .info-panel h2 { 
 color: #fca311; /* Желтый/Оранжевый для заголовка */
 margin-bottom: 15px;
 text-align: left;
 }

 .info-panel p { 
 color: #c4c4c4; 
 font-size: 1.1em;
 }
 </style>
</head>
<body>

 <div class="time-slider-container">
 <h2>Шкала времени: <span id="currentYear">2025</span> год</h2>
 <input type="range" id="timeSlider" min="1988" max="2025" value="2025" step="1" oninput="updateTime()">
 </div>

 </div>

 <div class="info-panel">
