<!DOCTYPE html>
<html lang="ru">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Time Traveler Prototype</title>
 <style>
  body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background-color: #f4f4f4; }
  .time-slider-container { width: 80%; margin-bottom: 30px; padding: 15px; background-color: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
  #timeSlider { width: 100%; }
  .map-container { display: flex; width: 80%; justify-content: space-around; margin-bottom: 20px; }
  .country-button { padding: 10px 20px; margin: 5px; cursor: pointer; border: 1px solid #ccc; background-color: #e9e9e9; border-radius: 4px; transition: background-color 0.2s; }
  .country-button:hover { background-color: #d1d1d1; }
  .info-panel { width: 80%; min-height: 200px; padding: 20px; border: 2px solid #3498db; background-color: #ecf0f1; border-radius: 8px; }
  h2 { color: #2c3e50; }
  p { color: #34495e; }
 </style>
</head>
<body>

 <div class="time-slider-container">
  <h2>Шкала времени: <span id="currentYear">2025</span> год</h2>
  <input type="range" id="timeSlider" min="1988" max="2025" value="2025" step="1" oninput="updateTime()">
 </div>

 <div class="map-container">
  <div class="country-button" onclick="selectCountry('russia')">Россия</div>
  <div class="country-button" onclick="selectCountry('usa')">США</div>
  <div class="country-button" onclick="selectCountry('china')">Китай</div>
 </div>

 <div class=
"info-panel">
  <h2>Информация</h2>
  <p id="countryName">Выберите страну и год.</p>
  <p id="countryInfo"></p>
 </div>

<script>
 // 1. База данных для прототипа
 // Здесь хранится информация о странах по годам.
 const database = {
  russia: {
   1990: { description: "СССР на пороге распада. Экономическая нестабильность, начало демократических реформ." },
   2000: { description: "Начало эпохи Путина. Экономический рост за счет нефти, укрепление вертикали власти." },
   2025: { description: "Современное состояние. Продолжение развития технологий и геополитической напряженности." }
  },
  usa: {
   1990: { description: "Конец Холодной войны. Период экономического подъема и культурного влияния." },
   2000: { description: "Президентство Буша. Начало войны с терроризмом после событий 11 сентября." },
   2025: { description: "Современное состояние. Фокус на внутренних политических конфликтах и развитии ИИ." }
  },
  china: {
   1990: { description: "Активное внедрение экономических реформ и интеграция в мировую торговлю." },
   2000: { description: "Вступление в ВТО. Ускорение экономического роста, превращение в 'мировую фабрику'." },
   2025: { description: "Современное состояние. Статус мировой сверхдержавы, фокус на технологическом суверенитете." }
  }
 };

 let selectedCountryId = null;

 // 2. Функция обновления времени
 function updateTime() {
  const year = document.getElementById('timeSlider').value;
  document.getElementById('currentYear').textContent = year;

  // Обновляем информацию, если страна выбрана
  if (selectedCountryId) {
   updateInfoPanel(selectedCountryId, parseInt(year));
  } else {
   document.getElementById('countryInfo').textContent = "Выберите страну, чтобы увидеть информацию за " + year + " год.";
  }
 }

 // 3. Функция выбора страны
 function selectCountry(countryId) {
  selectedCountryId = countryId;
  const year = parseInt(document.getElementById('timeSlider').v
alue);

  // Обновляем заголовок, показывая, какая страна выбрана
  const countryNameMap = { russia: 'Россия', usa: 'США', china: 'Китай' };
  document.getElementById('countryName').textContent = countryNameMap[countryId];

  // Обновляем информацию
  updateInfoPanel(countryId, year);
 }

 // 4. Функция обновления панели информации
 function updateInfoPanel(countryId, year) {
  const infoElement = document.getElementById('countryInfo');
  const countryData = database[countryId];

  // Ищем ближайшие доступные данные
  let closestYear = null;
  let minDiff = Infinity;

  for (const dataYear in countryData) {
   const diff = Math.abs(parseInt(dataYear) - year);
   if (diff < minDiff) {
    minDiff = diff;
    closestYear = dataYear;
   }
  }

  // Если данные найдены, показываем их
  if (closestYear !== null) {
   const data = countryData[closestYear];
   infoElement.innerHTML = `
    <p><strong>Информация за ${closestYear} год (ближайшая доступная дата к ${year} году):</strong></p>
    <p>${data.description}</p>
    <p>... здесь будет больше данных, таких как флаг, границы и т.д. ...</p>
   `;
  } else {
   infoElement.textContent = `Данные по этой стране на ${year} год пока недоступны.`;
  }
 }

 // Инициализация при загрузке страницы
 updateTime(); 
</script>

</body>
</html>
